name: Build and Publish AppJuice Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: AppJuice source ref to build
        required: true
        default: master
      release_tag:
        description: Optional release tag override (defaults to v<source version>)
        required: false
        default: ""
  repository_dispatch:
    types:
      - publish-release

permissions:
  contents: write

concurrency:
  group: appjuice-release-${{ github.event.inputs.release_tag || github.event.client_payload.release_tag || github.event.inputs.source_ref || github.event.client_payload.source_ref || github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-x64
            os: macos-15-intel
            arch: x64
            asset_name: AppJuice-macOS-x64.dmg
            update_asset_name: AppJuice-macOS-x64.zip
          - id: macos-arm64
            os: macos-15
            arch: arm64
            asset_name: AppJuice-macOS-arm64.dmg
            update_asset_name: AppJuice-macOS-arm64.zip
          # Temporarily disabled for the macOS-only release line. Re-enable these
          # matrix entries when Linux desktop and Hostless release assets are ready
          # to publish again.
          # - id: linux-server-x64
          #   os: ubuntu-22.04
          #   arch: x64
          #   asset_name: AppJuice-Linux-x64.tar.gz
          #   update_asset_name: ""
          # - id: linux-server-arm64
          #   os: ubuntu-22.04-arm
          #   arch: arm64
          #   asset_name: AppJuice-Linux-arm64.tar.gz
          #   update_asset_name: ""
          # - id: linux-desktop-x64
          #   os: ubuntu-22.04
          #   arch: x64
          #   asset_name: AppJuice-Linux-x64.AppImage
          #   update_asset_name: ""
          # - id: linux-desktop-arm64
          #   os: ubuntu-22.04-arm
          #   arch: arm64
          #   asset_name: AppJuice-Linux-arm64.AppImage
          #   update_asset_name: ""

    runs-on: ${{ matrix.os }}
    timeout-minutes: 360

    steps:
      - name: Resolve source ref
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.source_ref }}" ]; then
            printf 'ref=%s\n' "${{ inputs.source_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.client_payload.source_ref }}" ]; then
            printf 'ref=%s\n' "${{ github.event.client_payload.source_ref }}" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=%s\n' "master" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out AppJuice source
        uses: actions/checkout@v6
        with:
          repository: herrkaefer/appjuice
          ref: ${{ steps.source.outputs.ref }}
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.1

      - name: Enable corepack pnpm
        shell: bash
        working-directory: source
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Install Linux smoke dependencies
        if: startsWith(matrix.id, 'linux-desktop-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Set up Apple signing credentials
        if: runner.os == 'macOS'
        working-directory: source
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_NOTARY_KEYCHAIN_PROFILE: appjuice-notary
        run: ./scripts/ci/setup-macos-signing.sh

      - name: Build Linux server bundle
        if: startsWith(matrix.id, 'linux-server-')
        working-directory: source
        env:
          APPJUICE_BUNDLE_OFFLINE: "0"
          UNIAPP_BUNDLE_OFFLINE: "0"
        run: pnpm bundle:linux-server -- --output-root "$RUNNER_TEMP/linux-server-release" --platform linux --arch "${{ matrix.arch }}"

      - name: Install AppImage tooling
        if: startsWith(matrix.id, 'linux-desktop-')
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            TOOL_ARCH="aarch64"
          else
            TOOL_ARCH="x86_64"
          fi
          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${TOOL_ARCH}.AppImage"
          chmod +x /tmp/appimagetool

      - name: Build Linux Electron desktop packages
        if: startsWith(matrix.id, 'linux-desktop-')
        working-directory: source
        env:
          APPJUICE_BUNDLE_OFFLINE: "0"
          UNIAPP_BUNDLE_OFFLINE: "0"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          APPIMAGETOOL: /tmp/appimagetool
        run: pnpm bundle:electron-linux-desktop -- --output-root "$RUNNER_TEMP/electron-linux"

      - name: Smoke test Linux Electron AppImage
        if: startsWith(matrix.id, 'linux-desktop-')
        working-directory: source
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            node scripts/smoke-test-electron-appimage.mjs \
            "$RUNNER_TEMP/electron-linux/${{ matrix.asset_name }}" \
            --test-app-lifecycle \
            -- --disable-gpu

      - name: Build macOS Electron dmg
        if: runner.os == 'macOS'
        working-directory: source
        env:
          APPJUICE_BUNDLE_OFFLINE: "0"
          UNIAPP_BUNDLE_OFFLINE: "0"
        run: pnpm bundle:electron-macos-dmg

      - name: Stage release asset
        id: release_asset
        shell: bash
        working-directory: source
        run: |
          RELEASE_DIR="$RUNNER_TEMP/release-asset"
          mkdir -p "$RELEASE_DIR"
          TARGET="$RELEASE_DIR/${{ matrix.asset_name }}"

          if [ "${{ runner.os }}" = "macOS" ]; then
            cp artifacts/electron-macos/AppJuice-Electron-*.dmg "$TARGET"
            cp artifacts/electron-macos/AppJuice-Electron-*.zip "$RELEASE_DIR/${{ matrix.update_asset_name }}"
          elif [[ "${{ matrix.id }}" == linux-server-* ]]; then
            cp "$RUNNER_TEMP/linux-server-release/${{ matrix.asset_name }}" "$TARGET"
            cp "$RUNNER_TEMP/linux-server-release/SHA256SUMS" "$RELEASE_DIR/SHA256SUMS.${{ matrix.arch }}"
          elif [[ "${{ matrix.id }}" == linux-desktop-* ]]; then
            cp "$RUNNER_TEMP/electron-linux/${{ matrix.asset_name }}" "$TARGET"
            cp "$RUNNER_TEMP/electron-linux/AppJuice-Linux-${{ matrix.arch }}.deb" "$RELEASE_DIR/AppJuice-Linux-${{ matrix.arch }}.deb"
            cp "$RUNNER_TEMP/electron-linux/install-linux-desktop.sh" "$RELEASE_DIR/install-linux-desktop.sh"
          fi

          printf 'asset_path=%s\n' "$TARGET" >> "$GITHUB_OUTPUT"
          printf 'asset_dir=%s\n' "$RELEASE_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.id }}
          path: ${{ steps.release_asset.outputs.asset_dir }}/*
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Resolve source ref
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.source_ref }}" ]; then
            printf 'ref=%s\n' "${{ inputs.source_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.client_payload.source_ref }}" ]; then
            printf 'ref=%s\n' "${{ github.event.client_payload.source_ref }}" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=%s\n' "master" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out AppJuice source
        uses: actions/checkout@v6
        with:
          repository: herrkaefer/appjuice
          ref: ${{ steps.source.outputs.ref }}
          path: source

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./source/package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ -n "${{ github.event.client_payload.release_tag }}" ]; then
            TAG="${{ github.event.client_payload.release_tag }}"
          else
            TAG="v$VERSION"
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Download staged release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Merge Linux checksums
        shell: bash
        run: |
          shopt -s nullglob
          checksum_parts=(release-assets/SHA256SUMS.*)
          if [ "${#checksum_parts[@]}" -gt 0 ]; then
            cat "${checksum_parts[@]}" | sort -k 2 > release-assets/SHA256SUMS
            rm -f "${checksum_parts[@]}"
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          TITLE="AppJuice ${{ steps.release_meta.outputs.version }}"
          RELEASES_JSON="$(gh release list --repo "$REPO" --limit 100 --exclude-drafts --exclude-pre-releases --json tagName)"
          LATEST_FLAG="$(TAG="$TAG" RELEASES_JSON="$RELEASES_JSON" node <<'NODE'
          const currentTag = process.env.TAG || "";
          const releases = JSON.parse(process.env.RELEASES_JSON || "[]");
          const parseVersion = (tag) => {
            const match = String(tag || "").trim().match(/^v?(\d+)\.(\d+)\.(\d+)$/);
            return match ? match.slice(1).map((value) => Number.parseInt(value, 10)) : null;
          };
          const compareVersions = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              const delta = (left[index] || 0) - (right[index] || 0);
              if (delta !== 0) return delta;
            }
            return 0;
          };
          const current = parseVersion(currentTag);
          if (!current) {
            process.stdout.write("--latest=false");
            process.exit(0);
          }
          const highest = releases
            .map((release) => parseVersion(release.tagName))
            .filter(Boolean)
            .sort(compareVersions)
            .at(-1);
          process.stdout.write(!highest || compareVersions(current, highest) >= 0 ? "--latest" : "--latest=false");
          NODE
          )"
          CREATE_LATEST_FLAG=("$LATEST_FLAG")
          EDIT_LATEST_FLAG=()
          if [ "$LATEST_FLAG" = "--latest" ]; then
            EDIT_LATEST_FLAG=("--latest")
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --title "$TITLE" "${EDIT_LATEST_FLAG[@]}"
          else
            gh release create "$TAG" release-assets/* --repo "$REPO" --title "$TITLE" --generate-notes "${CREATE_LATEST_FLAG[@]}"
          fi
