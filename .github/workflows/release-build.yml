name: Build and Publish AppJuice Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: AppJuice source ref to build
        required: true
        default: master
      release_tag:
        description: Optional release tag override (defaults to v<source version>)
        required: false
        default: ""
  repository_dispatch:
    types:
      - publish-release

permissions:
  contents: write

concurrency:
  group: appjuice-release-${{ github.event.inputs.release_tag || github.event.client_payload.release_tag || github.event.inputs.source_ref || github.event.client_payload.source_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  validate_source:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Resolve source ref
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.source_ref }}" ]; then
            printf 'ref=%s\n' "${{ inputs.source_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.client_payload.source_ref }}" ]; then
            printf 'ref=%s\n' "${{ github.event.client_payload.source_ref }}" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=%s\n' "master" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve source repo token
        id: source_token
        shell: bash
        env:
          APPJUICE_REPO_TOKEN: ${{ secrets.APPJUICE_REPO_TOKEN }}
          UNIAPP_REPO_TOKEN: ${{ secrets.UNIAPP_REPO_TOKEN }}
        run: |
          TOKEN="$APPJUICE_REPO_TOKEN"
          if [ -z "$TOKEN" ]; then
            TOKEN="$UNIAPP_REPO_TOKEN"
          fi

          if [ -z "$TOKEN" ]; then
            echo "::error::Missing APPJUICE_REPO_TOKEN or UNIAPP_REPO_TOKEN secret with read access to herrkaefer/appjuice"
            exit 1
          fi

          printf 'token=%s\n' "$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Check out AppJuice source
        uses: actions/checkout@v6
        with:
          repository: herrkaefer/appjuice
          ref: ${{ steps.source.outputs.ref }}
          # Release-note evidence may refer to commits before the release tag.
          fetch-depth: 0
          token: ${{ steps.source_token.outputs.token }}
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: source/.node-version

      - name: Enable corepack pnpm
        shell: bash
        working-directory: source
        run: |
          corepack enable
          PACKAGE_MANAGER="$(node -p "require('./package.json').packageManager")"
          corepack prepare "$PACKAGE_MANAGER" --activate
          pnpm --version

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        shell: bash
        working-directory: source
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ -n "${{ github.event.client_payload.release_tag }}" ]; then
            TAG="${{ github.event.client_payload.release_tag }}"
          else
            TAG="v$VERSION"
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match source version v$VERSION"
            exit 1
          fi

      - name: Validate user-facing release notes
        working-directory: source
        run: node scripts/release-notes.mjs check --target --future --evidence

      - name: Typecheck release source
        working-directory: source
        run: |
          # Platform typechecking imports the app-runtime declarations from
          # its build output; create that clean-runner prerequisite first.
          pnpm --filter @appjuice/app-runtime build
          pnpm --filter @appjuice/app-runtime typecheck
          pnpm --filter @appjuice/platform typecheck
          pnpm --filter @appjuice/frontend typecheck

      - name: Install Electron Host test dependencies
        working-directory: source/host/electron
        run: npm ci

      - name: Test Electron Host
        working-directory: source
        run: pnpm test:electron-host

      - name: Test release packaging scripts
        working-directory: source
        run: node --test scripts/smoke-test-macos-release-artifacts.test.mjs

      - name: Build and smoke test release bundle
        working-directory: source
        run: node scripts/check-release-bundle.mjs

  compile_macos_icon:
    needs: validate_source
    # Icon Composer stacks need the macOS 26 runner. The macOS 15 compiler can
    # produce Assets.car, but it lacks the required IconImageStack data and the
    # release validation correctly rejects it.
    runs-on: macos-26

    steps:
      - name: Resolve source ref
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.source_ref }}" ]; then
            printf 'ref=%s\n' "${{ inputs.source_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.client_payload.source_ref }}" ]; then
            printf 'ref=%s\n' "${{ github.event.client_payload.source_ref }}" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=%s\n' "master" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve source repo token
        id: source_token
        shell: bash
        env:
          APPJUICE_REPO_TOKEN: ${{ secrets.APPJUICE_REPO_TOKEN }}
          UNIAPP_REPO_TOKEN: ${{ secrets.UNIAPP_REPO_TOKEN }}
        run: |
          TOKEN="$APPJUICE_REPO_TOKEN"
          if [ -z "$TOKEN" ]; then
            TOKEN="$UNIAPP_REPO_TOKEN"
          fi

          if [ -z "$TOKEN" ]; then
            echo "::error::Missing APPJUICE_REPO_TOKEN or UNIAPP_REPO_TOKEN secret with read access to herrkaefer/appjuice"
            exit 1
          fi

          printf 'token=%s\n' "$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Check out AppJuice source
        uses: actions/checkout@v6
        with:
          repository: herrkaefer/appjuice
          ref: ${{ steps.source.outputs.ref }}
          token: ${{ steps.source_token.outputs.token }}
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: source/.node-version

      - name: Select the hybrid-icon compiler toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.0.1.app/Contents/Developer
          xcodebuild -version

      - name: Test macOS release packaging scripts
        working-directory: source
        run: node --test scripts/build-electron-app.test.mjs

      - name: Compile Tahoe Icon Composer assets
        working-directory: source
        run: |
          node scripts/build-macos-icon-assets.mjs \
            --output-dir "$RUNNER_TEMP/appjuice-macos-icon-assets"

      - name: Upload Tahoe Icon Composer assets
        uses: actions/upload-artifact@v6
        with:
          name: appjuice-macos-icon-assets
          path: ${{ runner.temp }}/appjuice-macos-icon-assets
          retention-days: 3

  build:
    needs: compile_macos_icon
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-x64
            os: macos-15-intel
            arch: x64
            asset_name: AppJuice-macOS-x64.dmg
            update_asset_name: AppJuice-macOS-x64.zip
          - id: macos-arm64
            os: macos-15
            arch: arm64
            asset_name: AppJuice-macOS-arm64.dmg
            update_asset_name: AppJuice-macOS-arm64.zip
          # Temporarily disabled for the macOS-only release line. Re-enable these
          # matrix entries when Linux desktop and Hostless release assets are ready
          # to publish again.
          # - id: linux-server-x64
          #   os: ubuntu-22.04
          #   arch: x64
          #   asset_name: AppJuice-Linux-x64.tar.gz
          #   update_asset_name: ""
          # - id: linux-server-arm64
          #   os: ubuntu-22.04-arm
          #   arch: arm64
          #   asset_name: AppJuice-Linux-arm64.tar.gz
          #   update_asset_name: ""
          # - id: linux-desktop-x64
          #   os: ubuntu-22.04
          #   arch: x64
          #   asset_name: AppJuice-Linux-x64.AppImage
          #   update_asset_name: ""
          # - id: linux-desktop-arm64
          #   os: ubuntu-22.04-arm
          #   arch: arm64
          #   asset_name: AppJuice-Linux-arm64.AppImage
          #   update_asset_name: ""

    runs-on: ${{ matrix.os }}
    timeout-minutes: 360

    steps:
      - name: Resolve source ref
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.source_ref }}" ]; then
            printf 'ref=%s\n' "${{ inputs.source_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.client_payload.source_ref }}" ]; then
            printf 'ref=%s\n' "${{ github.event.client_payload.source_ref }}" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=%s\n' "master" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve source repo token
        id: source_token
        shell: bash
        env:
          APPJUICE_REPO_TOKEN: ${{ secrets.APPJUICE_REPO_TOKEN }}
          UNIAPP_REPO_TOKEN: ${{ secrets.UNIAPP_REPO_TOKEN }}
        run: |
          TOKEN="$APPJUICE_REPO_TOKEN"
          if [ -z "$TOKEN" ]; then
            TOKEN="$UNIAPP_REPO_TOKEN"
          fi

          if [ -z "$TOKEN" ]; then
            echo "::error::Missing APPJUICE_REPO_TOKEN or UNIAPP_REPO_TOKEN secret with read access to herrkaefer/appjuice"
            exit 1
          fi

          printf 'token=%s\n' "$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Check out AppJuice source
        uses: actions/checkout@v6
        with:
          repository: herrkaefer/appjuice
          ref: ${{ steps.source.outputs.ref }}
          token: ${{ steps.source_token.outputs.token }}
          path: source

      - name: Download Tahoe Icon Composer assets
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v8
        with:
          name: appjuice-macos-icon-assets
          path: ${{ runner.temp }}/appjuice-macos-icon-assets

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: source/.node-version

      - name: Enable corepack pnpm
        shell: bash
        working-directory: source
        run: |
          corepack enable
          PACKAGE_MANAGER="$(node -p "require('./package.json').packageManager")"
          corepack prepare "$PACKAGE_MANAGER" --activate
          pnpm --version

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Install Linux smoke dependencies
        if: startsWith(matrix.id, 'linux-desktop-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Set up Apple signing credentials
        if: runner.os == 'macOS'
        working-directory: source
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_NOTARY_KEYCHAIN_PROFILE: appjuice-notary
        run: ./scripts/ci/setup-macos-signing.sh

      - name: Build Linux server bundle
        if: startsWith(matrix.id, 'linux-server-')
        working-directory: source
        env:
          APPJUICE_BUNDLE_OFFLINE: "0"
          UNIAPP_BUNDLE_OFFLINE: "0"
        run: pnpm bundle:linux-server -- --output-root "$RUNNER_TEMP/linux-server-release" --platform linux --arch "${{ matrix.arch }}"

      - name: Smoke test Linux server bundle install
        if: startsWith(matrix.id, 'linux-server-')
        working-directory: source
        run: |
          node scripts/smoke-test-linux-server-bundle.mjs \
            "$RUNNER_TEMP/linux-server-release/${{ matrix.asset_name }}" \
            --sums "$RUNNER_TEMP/linux-server-release/SHA256SUMS"

      - name: Install AppImage tooling
        if: startsWith(matrix.id, 'linux-desktop-')
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            TOOL_ARCH="aarch64"
          else
            TOOL_ARCH="x86_64"
          fi
          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${TOOL_ARCH}.AppImage"
          chmod +x /tmp/appimagetool

      - name: Build Linux Electron desktop packages
        if: startsWith(matrix.id, 'linux-desktop-')
        working-directory: source
        env:
          APPJUICE_BUNDLE_OFFLINE: "0"
          UNIAPP_BUNDLE_OFFLINE: "0"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          APPIMAGETOOL: /tmp/appimagetool
        run: pnpm bundle:electron-linux-desktop -- --output-root "$RUNNER_TEMP/electron-linux"

      - name: Smoke test Linux Electron AppImage
        if: startsWith(matrix.id, 'linux-desktop-')
        working-directory: source
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            node scripts/smoke-test-electron-appimage.mjs \
            "$RUNNER_TEMP/electron-linux/${{ matrix.asset_name }}" \
            --test-app-lifecycle \
            -- --disable-gpu

      - name: Build macOS Electron dmg
        if: runner.os == 'macOS'
        working-directory: source
        env:
          APPJUICE_BUNDLE_OFFLINE: "0"
          UNIAPP_BUNDLE_OFFLINE: "0"
          APPJUICE_MAC_ICON_ASSETS_DIR: ${{ runner.temp }}/appjuice-macos-icon-assets
        run: pnpm bundle:electron-macos-dmg

      - name: Smoke test packaged macOS desktop startup
        if: runner.os == 'macOS'
        working-directory: source
        run: |
          node scripts/smoke-test-electron-appimage.mjs \
            artifacts/electron-macos/AppJuice.app \
            --timeout-ms 120000 \
            --test-app-lifecycle \
            -- --disable-gpu --use-mock-keychain

      - name: Smoke test final macOS release artifacts
        if: runner.os == 'macOS'
        working-directory: source
        run: |
          node scripts/smoke-test-macos-release-artifacts.mjs \
            --artifacts-dir artifacts/electron-macos \
            --expected-version "$(node -p "require('./package.json').version")" \
            --expected-arch "${{ matrix.arch }}" \
            --timeout-ms 120000

      - name: Stage release asset
        id: release_asset
        shell: bash
        working-directory: source
        run: |
          RELEASE_DIR="$RUNNER_TEMP/release-asset"
          mkdir -p "$RELEASE_DIR"
          TARGET="$RELEASE_DIR/${{ matrix.asset_name }}"

          if [ "${{ runner.os }}" = "macOS" ]; then
            cp artifacts/electron-macos/AppJuice-Electron-*.dmg "$TARGET"
            cp artifacts/electron-macos/AppJuice-Electron-*.zip "$RELEASE_DIR/${{ matrix.update_asset_name }}"
            (
              cd "$RELEASE_DIR"
              shasum -a 256 "${{ matrix.asset_name }}" "${{ matrix.update_asset_name }}" > "SHA256SUMS.${{ matrix.arch }}"
            )
          elif [[ "${{ matrix.id }}" == linux-server-* ]]; then
            cp "$RUNNER_TEMP/linux-server-release/${{ matrix.asset_name }}" "$TARGET"
            cp "$RUNNER_TEMP/linux-server-release/SHA256SUMS" "$RELEASE_DIR/SHA256SUMS.${{ matrix.arch }}"
          elif [[ "${{ matrix.id }}" == linux-desktop-* ]]; then
            cp "$RUNNER_TEMP/electron-linux/${{ matrix.asset_name }}" "$TARGET"
            cp "$RUNNER_TEMP/electron-linux/AppJuice-Linux-${{ matrix.arch }}.deb" "$RELEASE_DIR/AppJuice-Linux-${{ matrix.arch }}.deb"
            cp "$RUNNER_TEMP/electron-linux/install-linux-desktop.sh" "$RELEASE_DIR/install-linux-desktop.sh"
          fi

          printf 'asset_path=%s\n' "$TARGET" >> "$GITHUB_OUTPUT"
          printf 'asset_dir=%s\n' "$RELEASE_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.id }}
          path: ${{ steps.release_asset.outputs.asset_dir }}/*
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Resolve source ref
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.source_ref }}" ]; then
            printf 'ref=%s\n' "${{ inputs.source_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.client_payload.source_ref }}" ]; then
            printf 'ref=%s\n' "${{ github.event.client_payload.source_ref }}" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=%s\n' "master" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve source repo token
        id: source_token
        shell: bash
        env:
          APPJUICE_REPO_TOKEN: ${{ secrets.APPJUICE_REPO_TOKEN }}
          UNIAPP_REPO_TOKEN: ${{ secrets.UNIAPP_REPO_TOKEN }}
        run: |
          TOKEN="$APPJUICE_REPO_TOKEN"
          if [ -z "$TOKEN" ]; then
            TOKEN="$UNIAPP_REPO_TOKEN"
          fi

          if [ -z "$TOKEN" ]; then
            echo "::error::Missing APPJUICE_REPO_TOKEN or UNIAPP_REPO_TOKEN secret with read access to herrkaefer/appjuice"
            exit 1
          fi

          printf 'token=%s\n' "$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Check out AppJuice source
        uses: actions/checkout@v6
        with:
          repository: herrkaefer/appjuice
          ref: ${{ steps.source.outputs.ref }}
          # Re-check the complete evidence set before making the release public.
          fetch-depth: 0
          token: ${{ steps.source_token.outputs.token }}
          path: source

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./source/package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ -n "${{ github.event.client_payload.release_tag }}" ]; then
            TAG="${{ github.event.client_payload.release_tag }}"
          else
            TAG="v$VERSION"
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match source version v$VERSION"
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate user-facing release notes
        working-directory: source
        run: node scripts/release-notes.mjs check --target --future --evidence

      - name: Download staged release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Merge release checksums
        shell: bash
        run: |
          shopt -s nullglob
          checksum_parts=(release-assets/SHA256SUMS.*)
          if [ "${#checksum_parts[@]}" -gt 0 ]; then
            cat "${checksum_parts[@]}" | sort -k 2 > release-assets/SHA256SUMS
            rm -f "${checksum_parts[@]}"
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          TITLE="AppJuice ${{ steps.release_meta.outputs.version }}"
          RELEASES_JSON="$(gh release list --repo "$REPO" --limit 100 --exclude-drafts --exclude-pre-releases --json tagName)"
          LATEST_FLAG="$(TAG="$TAG" RELEASES_JSON="$RELEASES_JSON" node <<'NODE'
          const currentTag = process.env.TAG || "";
          const releases = JSON.parse(process.env.RELEASES_JSON || "[]");
          const parseVersion = (tag) => {
            const match = String(tag || "").trim().match(/^v?(\d+)\.(\d+)\.(\d+)$/);
            return match ? match.slice(1).map((value) => Number.parseInt(value, 10)) : null;
          };
          const compareVersions = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              const delta = (left[index] || 0) - (right[index] || 0);
              if (delta !== 0) return delta;
            }
            return 0;
          };
          const current = parseVersion(currentTag);
          if (!current) {
            process.stdout.write("--latest=false");
            process.exit(0);
          }
          const highest = releases
            .map((release) => parseVersion(release.tagName))
            .filter(Boolean)
            .sort(compareVersions)
            .at(-1);
          process.stdout.write(!highest || compareVersions(current, highest) >= 0 ? "--latest" : "--latest=false");
          NODE
          )"
          CREATE_LATEST_FLAG=("$LATEST_FLAG")
          EDIT_LATEST_FLAG=()
          if [ "$LATEST_FLAG" = "--latest" ]; then
            EDIT_LATEST_FLAG=("--latest")
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$REPO" --clobber
            PUBLISHED_AT="$(gh release view "$TAG" --repo "$REPO" --json publishedAt --jq .publishedAt)"
            PRERELEASE_FLAG=()
            if [ "$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)" = "true" ]; then
              PRERELEASE_FLAG=("--prerelease")
            fi
          else
            PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            node source/scripts/release-notes.mjs render \
              --notes-dir source/release-notes \
              --version "${{ steps.release_meta.outputs.version }}" \
              --published-at "$PUBLISHED_AT" \
              --output release-notes.md
            gh release create "$TAG" release-assets/* --repo "$REPO" --title "$TITLE" --notes-file release-notes.md "${CREATE_LATEST_FLAG[@]}"
            PUBLISHED_AT="$(gh release view "$TAG" --repo "$REPO" --json publishedAt --jq .publishedAt)"
            PRERELEASE_FLAG=()
          fi

          node source/scripts/release-notes.mjs render \
            --notes-dir source/release-notes \
            --version "${{ steps.release_meta.outputs.version }}" \
            --published-at "$PUBLISHED_AT" \
            "${PRERELEASE_FLAG[@]}" \
            --output release-notes.md
          gh release edit "$TAG" --repo "$REPO" --title "$TITLE" --notes-file release-notes.md "${EDIT_LATEST_FLAG[@]}"
          gh release view "$TAG" --repo "$REPO" --json body --jq .body > published-release-notes.md
          node source/scripts/release-notes.mjs verify-public \
            --input published-release-notes.md \
            --version "${{ steps.release_meta.outputs.version }}" \
            --published-at "$PUBLISHED_AT" \
            "${PRERELEASE_FLAG[@]}"

      - name: Trigger website release history sync
        id: website_sync
        shell: bash
        env:
          GH_TOKEN: ${{ steps.source_token.outputs.token }}
        run: |
          printf 'not_before=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh api --method POST repos/herrkaefer/appjuice-site/dispatches \
            --raw-field "event_type=sync-release-history" \
            --raw-field "client_payload[release_tag]=${{ steps.release_meta.outputs.tag }}"

      - name: Verify deployed website Release Notes
        shell: bash
        env:
          GH_TOKEN: ${{ steps.source_token.outputs.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          NOT_BEFORE: ${{ steps.website_sync.outputs.not_before }}
        run: |
          SYNC_RUN_ID=""
          for attempt in $(seq 1 30); do
            RUNS_JSON="$(gh run list \
              -R herrkaefer/appjuice-site \
              --workflow "Sync Release History" \
              --event repository_dispatch \
              --limit 20 \
              --json databaseId,status,conclusion,createdAt)"
            SYNC_RUN_ID="$(RUNS_JSON="$RUNS_JSON" NOT_BEFORE="$NOT_BEFORE" node -e '
              const notBefore = Date.parse(process.env.NOT_BEFORE || "");
              const runs = JSON.parse(process.env.RUNS_JSON || "[]");
              const match = runs.find((run) => Date.parse(run.createdAt) >= notBefore);
              process.stdout.write(match ? String(match.databaseId) : "");
            ')"
            if [ -n "$SYNC_RUN_ID" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$SYNC_RUN_ID" ]; then
            echo "::error::Timed out waiting for the website Release History sync workflow to start."
            exit 1
          fi

          for attempt in $(seq 1 90); do
            STATUS="$(gh run view "$SYNC_RUN_ID" -R herrkaefer/appjuice-site --json status,conclusion --jq '.status + ":" + (.conclusion // "")')"
            case "$STATUS" in
              completed:success) break ;;
              completed:*)
                echo "::error::Website Release History sync failed: $STATUS"
                exit 1
                ;;
            esac
            sleep 4
          done
          if [ "$STATUS" != "completed:success" ]; then
            echo "::error::Timed out waiting for website Release History sync run $SYNC_RUN_ID."
            exit 1
          fi

          HISTORY_PATH="$RUNNER_TEMP/release-history.json"
          for attempt in $(seq 1 90); do
            curl --fail --silent --show-error --retry 2 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              --output "$HISTORY_PATH" \
              "https://appjuice.app/guide/releases/releases.json" || true
            if node -e '
              const fs = require("node:fs");
              try {
                const history = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const version = String(process.argv[2] || "").replace(/^v/, "");
                if (!history?.releases?.some((release) => release?.version === version)) process.exit(1);
              } catch {
                process.exit(1);
              }
            ' "$HISTORY_PATH" "$RELEASE_TAG"; then
              exit 0
            fi
            sleep 4
          done
          echo "::error::The live Release Notes page did not include $RELEASE_TAG after its sync workflow completed."
          exit 1
