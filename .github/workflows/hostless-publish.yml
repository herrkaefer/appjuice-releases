name: Publish qualified Hostless release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful confidential candidate build run ID
        required: true
        type: string
      version:
        description: Version with committed qualification record and approved English notes
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hostless-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate publication request
        env:
          VERSION: ${{ inputs.version }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          assert re.fullmatch(r'\d+\.\d+\.\d+',os.environ['VERSION'])
          assert re.fullmatch(r'\d+',os.environ['BUILD_RUN'])
          assert Path('hostless/qualifications/v'+os.environ['VERSION']+'.json').is_file()
          assert Path('hostless/notes/v'+os.environ['VERSION']+'.json').is_file()
          PY
      - name: Download audited candidates and stage approved files
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion,event,workflowName > run.json
          python3 - <<'PY'
          import json
          run=json.load(open('run.json'))
          assert run['conclusion']=='success' and run['event']=='workflow_dispatch'
          assert run['workflowName']=='Build encrypted Hostless packages'
          PY
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" -n AppJuice-Hostless-Candidate-x64 -D candidates/x64
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" -n AppJuice-Hostless-Candidate-arm64 -D candidates/arm64
          python3 scripts/hostless/prepare-release.py --candidates candidates --qualification "hostless/qualifications/v$VERSION.json" --output approved
      - name: Publish assets and advance server index
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Refuse an existing public release: preserve its desktop assets/checksums.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing release requires reviewed asset/checksum merging; nothing published.'
            exit 1
          fi
          python3 scripts/hostless/render-note.py --note "hostless/notes/v$VERSION.json" --version "$VERSION" --published-at "1970-01-01T00:00:00Z" --output draft-note.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --latest=false --title "AppJuice Server $VERSION" --notes-file draft-note.md
          gh release upload "v$VERSION" approved/* --repo "$GITHUB_REPOSITORY"
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,publishedAt > release-metadata.json
          python3 scripts/hostless/render-note.py --note "hostless/notes/v$VERSION.json" --version "$VERSION" --metadata release-metadata.json --output published-note.md
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --latest=false --notes-file published-note.md
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body > published-body.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.load(open('published-body.json'))['body'] == Path('published-note.md').read_text()
          PY
          cp approved/index.json hostless/index.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hostless/index.json
          git commit -m "Publish qualified Hostless $VERSION index"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:main
