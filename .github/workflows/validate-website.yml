name: Validate private website
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main or same-repository PR head SHA (empty checks new heads)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: private-website-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate trusted website commits with confidential output
        env:
          WEBSITE_TOKEN: ${{ secrets.APPJUICE_REPO_TOKEN }}
          WEBSITE_AGE_RECIPIENT: ${{ vars.HOSTLESS_AGE_RECIPIENT }}
          WEBSITE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/website/validate.py
      - name: Upload encrypted diagnostics only
        if: ${{ always() && hashFiles('website-diagnostics/*.age') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-website-diagnostics
          path: website-diagnostics/*.age
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
